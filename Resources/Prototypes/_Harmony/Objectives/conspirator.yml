- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseConspiratorObjective
  components:
  - type: Objective
    issuer: Conspirator
    difficulty: 0 # uses own system for assignment
  - type: RoleRequirement
    roles:
    - ConspiratorRole
  - type: NoCompletionObjective

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorObjective # The default objective for randomised objectives. Shouldn't be used, and it's essentially just a compressed version of the other three.
  name: Turn today into a novel tale of the station's downfall
  description: Work behind the scenes with your fellow conspirators to bring Nanotrasen's station to its knees, and do not let today become lost within the countless generic syndicate-sponsored masssacres and engineering disasters. Your only limit is your imagination.
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/bureaucracy.rsi
      state: newspaper

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorDownfallObjective
  name: Engineer the station's downfall
  description: Use your positions to bring Nanotrasen's new station to its knees.
  components:
  - type: Objective
    icon:
      sprite: Objects/Devices/declaration_of_war.rsi
      state: declarator

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorUniqueObjective
  name: Stand out
  description: Don't let today become lost within the countless syndicate-sponsored mass shootings or singularity-related accidents.
  components:
  - type: Objective
    icon:
      sprite: Decals/stencil.rsi
      state: stencil_Exclaim

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorMemorableObjective
  name: Make today a story
  description: They should be telling tales of what you to today for years to come.
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/bureaucracy.rsi
      state: newspaper